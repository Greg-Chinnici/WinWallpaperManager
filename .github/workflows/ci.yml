name: CI

# Every push and PR: build, publish (AOT host + daemon, self-contained tray), smoke-test the
# published app, build the MSI, and upload both as workflow artifacts.
# Pushing a tag like v0.2.0 also creates a GitHub pre-release with the MSI and a portable zip.

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Version
        id: version
        shell: pwsh
        run: |
          # Tags v1.2.3 -> 1.2.3; everything else -> 0.1.<run number> (MSI needs plain MAJOR.MINOR.PATCH).
          $ref = "${{ github.ref }}"
          if ($ref -match '^refs/tags/v(\d+\.\d+\.\d+)$') { $v = $Matches[1] } else { $v = "0.1.${{ github.run_number }}" }
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Version $v"

      - name: Build solution
        run: dotnet build WinWallpaperManager.slnx -c Release

      - name: Publish app and build MSI
        shell: pwsh
        run: ./build/publish.ps1 -Version ${{ steps.version.outputs.version }} -Msi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Smoke test published app
        shell: pwsh
        run: ./build/smoke.ps1 -AppDir artifacts/publish/WinWallpaper

      - name: Zip portable build
        shell: pwsh
        run: Compress-Archive -Path artifacts/publish/WinWallpaper/* -DestinationPath artifacts/installer/WinWallpaper-${{ steps.version.outputs.version }}-x64-portable.zip

      - uses: actions/upload-artifact@v4
        with:
          name: WinWallpaper-${{ steps.version.outputs.version }}
          path: |
            artifacts/installer/*.msi
            artifacts/installer/*.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: WinWallpaper-${{ needs.build.outputs.version }}
          path: dist

      - name: Create GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/* \
            --repo "${{ github.repository }}" \
            --title "WinWallpaper ${{ needs.build.outputs.version }}" \
            --generate-notes \
            --prerelease
